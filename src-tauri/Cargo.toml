[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
platform = { path = "crates/platform" }
domain = { path = "crates/domain" }
app = { path = "crates/app" }
adapter-sqlite = { path = "crates/adapter-sqlite" }
adapter-fs = { path = "crates/adapter-fs" }
adapter-mcp = { path = "crates/adapter-mcp" }
adapter-print = { path = "crates/adapter-print" }
presentation = { path = "crates/presentation" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3"
notify = "8"
rmcp = { version = "3.7", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
ts-rs = "12"
window-vibrancy = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

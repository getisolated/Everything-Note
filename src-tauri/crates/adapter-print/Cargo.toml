[package]
name = "adapter-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Impression native d'une page HTML en PDF dans un webview caché (WKWebView, WebView2)"

# Les lints du workspace, sauf `unsafe_code` : refusé partout (`deny`) mais autorisable sur
# les seuls modules qui appellent WebKit ou WebView2 (`macos.rs`, `windows.rs`)
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
app.workspace = true
platform.workspace = true
tauri.workspace = true
tracing.workspace = true

# Les versions que tauri / wry tirent déjà (`cargo tree -i objc2`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "WKWebView",
] }

# Les versions que tauri / wry tirent déjà (`cargo tree -i webview2-com`)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

# Impression réelle, lancée à la main (voir le fichier) : la boucle de Tauri veut le thread
# principal, hors du harnais de test
[[test]]
name = "print_pdf"
harness = false
